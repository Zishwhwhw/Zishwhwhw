<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Andrii Drymchenko — Backend Developer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0a0714"/>
      <stop offset="55%" stop-color="#120b26"/>
      <stop offset="100%" stop-color="#05040a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="58%">
      <stop offset="0%"   stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#6d28d9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#c4b5fd" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#ede9fe" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#c4b5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="70%">
      <stop offset="0%"   stop-color="#f5f3ff"/>
      <stop offset="35%"  stop-color="#c4b5fd"/>
      <stop offset="70%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="280"/></clipPath>
    <clipPath id="water"><rect x="0" y="182" width="1200" height="98"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#sky)"/>
    <rect width="1200" height="280" fill="url(#halo)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- moon of kyoka suigetsu -->
    <circle cx="1020" cy="74" r="46" fill="#ede9fe" opacity="0.10" filter="url(#soft)"/>
    <circle cx="1020" cy="74" r="30" fill="#f5f3ff" opacity="0.88">
      <animate attributeName="opacity" values="0.85;0.6;0.85" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1036" cy="64" r="27" fill="#0a0714"/>

    <!-- shattered mirror shards -->
    <g transform="skewX(-16)">
      <rect x="60"   y="-20" width="26" height="320" fill="url(#shard)" opacity="0.06"><animate attributeName="opacity" values="0.03;0.20;0.03" dur="5.5s" begin="0s"    repeatCount="indefinite"/></rect>
      <rect x="150"  y="-20" width="12" height="320" fill="url(#shard)" opacity="0.06"><animate attributeName="opacity" values="0.05;0.26;0.05" dur="4.2s" begin="0.7s"  repeatCount="indefinite"/></rect>
      <rect x="235"  y="-20" width="34" height="320" fill="url(#shard)" opacity="0.06"><animate attributeName="opacity" values="0.02;0.14;0.02" dur="6.8s" begin="1.4s"  repeatCount="indefinite"/></rect>
      <rect x="330"  y="-20" width="9"  height="320" fill="url(#shard)" opacity="0.06"><animate attributeName="opacity" values="0.06;0.30;0.06" dur="3.9s" begin="0.3s"  repeatCount="indefinite"/></rect>
      <rect x="470"  y="-20" width="18" height="320" fill="url(#shard)" opacity="0.06"><animate attributeName="opacity" values="0.03;0.18;0.03" dur="5.1s" begin="2.1s"  repeatCount="indefinite"/></rect>
      <rect x="620"  y="-20" width="28" height="320" fill="url(#shard)" opacity="0.06"><animate attributeName="opacity" values="0.02;0.16;0.02" dur="7.4s" begin="1.1s"  repeatCount="indefinite"/></rect>
      <rect x="740"  y="-20" width="11" height="320" fill="url(#shard)" opacity="0.06"><animate attributeName="opacity" values="0.05;0.28;0.05" dur="4.6s" begin="2.8s"  repeatCount="indefinite"/></rect>
      <rect x="860"  y="-20" width="22" height="320" fill="url(#shard)" opacity="0.06"><animate attributeName="opacity" values="0.03;0.19;0.03" dur="6.1s" begin="0.9s"  repeatCount="indefinite"/></rect>
      <rect x="980"  y="-20" width="14" height="320" fill="url(#shard)" opacity="0.06"><animate attributeName="opacity" values="0.04;0.22;0.04" dur="5.0s" begin="3.3s"  repeatCount="indefinite"/></rect>
      <rect x="1090" y="-20" width="30" height="320" fill="url(#shard)" opacity="0.06"><animate attributeName="opacity" values="0.02;0.15;0.02" dur="6.4s" begin="1.8s"  repeatCount="indefinite"/></rect>
      <rect x="1190" y="-20" width="16" height="320" fill="url(#shard)" opacity="0.06"><animate attributeName="opacity" values="0.04;0.24;0.04" dur="4.8s" begin="2.4s"  repeatCount="indefinite"/></rect>
    </g>

    <!-- hogyoku -->
    <circle cx="112" cy="140" r="34" fill="#7c3aed" opacity="0.35" filter="url(#soft)">
      <animate attributeName="r" values="30;44;30" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="112" cy="140" r="15" fill="url(#orb)">
      <animate attributeName="r" values="14;16.5;14" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- vertical kanji: kyoka suigetsu -->
    <text x="44" y="86" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="26" fill="#c4b5fd" opacity="0.30" writing-mode="tb">鏡花水月</text>

    <!-- name -->
    <text x="600" y="132" text-anchor="middle" font-family="'Trebuchet MS',Verdana,Geneva,sans-serif"
          font-size="54" font-weight="bold" letter-spacing="10" fill="#f8fafc">ANDRII DRYMCHENKO</text>
    <text x="600" y="166" text-anchor="middle" font-family="'Trebuchet MS',Verdana,Geneva,sans-serif"
          font-size="17" letter-spacing="5.5" fill="#c4b5fd" opacity="0.92">BACKEND DEVELOPER · JAVA · SPRING · PYTHON
      <animate attributeName="opacity" values="0.92;0.55;0.92" dur="6s" repeatCount="indefinite"/>
    </text>

    <!-- water reflection of the name -->
    <g clip-path="url(#water)" opacity="0.22">
      <g transform="translate(0,332) scale(1,-1)">
        <text x="600" y="132" text-anchor="middle" font-family="'Trebuchet MS',Verdana,Geneva,sans-serif"
              font-size="54" font-weight="bold" letter-spacing="10" fill="#a78bfa">ANDRII DRYMCHENKO</text>
      </g>
      <g fill="#05040a">
        <rect x="0" y="196" width="1200" height="3"><animate attributeName="y" values="196;210;196" dur="5s" repeatCount="indefinite"/></rect>
        <rect x="0" y="214" width="1200" height="2"><animate attributeName="y" values="214;226;214" dur="6.5s" repeatCount="indefinite"/></rect>
        <rect x="0" y="232" width="1200" height="3"><animate attributeName="y" values="232;244;232" dur="4.2s" repeatCount="indefinite"/></rect>
      </g>
    </g>

    <!-- blade sweep -->
    <g transform="skewX(-16)">
      <rect x="-360" y="-40" width="150" height="360" fill="url(#slash)" opacity="0.5" filter="url(#soft2)">
        <animate attributeName="x" values="-360;-360;1420;1420" keyTimes="0;0.55;0.78;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="180" y="188" width="840" height="1.5" fill="url(#rule)" opacity="0.75">
      <animate attributeName="opacity" values="0.35;0.85;0.35" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
